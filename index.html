<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#385b37"><meta name="robots" content="noindex,nofollow"><title>Сад под сакурой · Ксюшеньке</title><link rel="stylesheet" href="./style.css"></head><body>
<main id="garden" aria-label="Весенний сад для Ксюшеньки">
<canvas id="scene" aria-hidden="true"></canvas><div id="targets" role="group" aria-label="Животные и предметы сада"></div>
<header><div class="plaque title"><span id="subtitle"></span><h1 id="title"></h1></div><div class="plaque date" id="date"></div></header>
<nav class="toolbar" aria-label="Управление садом"><button id="letterButton"><span aria-hidden="true">✉</span> <span></span></button><button id="notesButton"><span aria-hidden="true">▤</span> <span></span></button><button id="musicButton" aria-pressed="true"></button><button id="motionButton" aria-pressed="true"></button></nav>
<details class="player" id="player"><summary>♫ <span id="nowPlaying">Мелодии сада</span></summary><div class="player-panel"><label for="trackSelect">Мелодии сада</label><div class="track-picker"><select id="trackSelect" aria-label="Выбрать композицию"></select></div><div class="player-actions"><button id="previousTrack" aria-label="Предыдущая композиция">‹</button><label for="volume">Громкость <input id="volume" type="range" min="0" max="100" value="35"></label><button id="nextTrack" aria-label="Следующая композиция">›</button></div><small>Музыка ConcernedApe · Stardew Valley</small></div></details>
<div id="status" role="status" class="status"></div><noscript>Для прогулки по саду включи JavaScript в браузере.</noscript>
</main>
<dialog id="dialog" aria-labelledby="dialogTitle" aria-describedby="dialogText"><form method="dialog"><button class="close" id="close" aria-label="Закрыть">×</button></form><p id="kicker" class="kicker"></p><h2 id="dialogTitle"></h2><div id="dialogBody"><p id="dialogText"></p><div id="noteList" hidden></div></div><div class="dialog-bottom"><span id="pageLabel"></span><div class="pager"><button id="back"></button><button id="next"></button></div></div><button id="welcomeLetter" class="text-button"></button></dialog>
<script type="module" src="./app.js"></script></body></html>
